name: Xcode - Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release__nightly:
        description: Create a nightly release
        type: boolean
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Run regression tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 tests/run_swift_regressions.py
          python3 tests/run_cheat_regressions.py
          cc -Wall -Wextra -Werror tests/current_process_files.c -o /tmp/gamecase-file-tests
          /tmp/gamecase-file-tests

  build:
    name: Build using xcodebuild command
    runs-on: macos-15-intel
    env:
      archive_path: archive
    outputs:
      artifact: GameCase.ipa
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive -archivePath "$archive_path" -scheme LiveContainer -project LiveContainer.xcodeproj -sdk iphoneos -arch arm64 -configuration Release | xcpretty
      - name: Create IPA
        run: sh .github/build_github.sh
      - name: Bundle corresponding source and build materials
        run: python3 .github/create_source_bundle.py
      - uses: actions/upload-artifact@v7
        with:
          name: GameCase.ipa
          path: |
            GameCase.ipa
            GameCase-source.tar.gz
          if-no-files-found: error

  release__nightly:
    name: Nightly Release
    permissions:
      contents: write
    if: inputs.release__nightly || github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: [build, regressions]
    concurrency:
      group: release__nightly
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Get commit info
        run: |
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "commit_msg=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"
      - name: Generate source for this build
        env:
          NIGHTLY_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/update_json.py
      - name: Nightly Release
        uses: andelf/nightly-release@5834076edc55cc05975561c9722043f072ac5c26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            Corresponding source and build instructions: `GameCase-source.tar.gz` below.
            Licenses and notices are included in the IPA and source bundle.

            [Build workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: |
            GameCase.ipa
            GameCase-source.tar.gz
            LICENSE
            THIRD_PARTY_NOTICES.md
            .github/apps_nightly.json
